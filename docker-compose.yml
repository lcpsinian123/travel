version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: chinatravel-db
    environment:
      POSTGRES_USER: chinatravel
      POSTGRES_PASSWORD: chinatravel_dev
      POSTGRES_DB: chinatravel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinatravel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chinatravel-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://chinatravel:chinatravel_dev@db:5432/chinatravel
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  # Next.js Frontend (optional - for local development)
  # frontend:
  #   image: node:20-alpine
  #   container_name: chinatravel-frontend
  #   working_dir: /app
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
  #   volumes:
  #     - ./frontend:/app
  #   command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
